<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b0e"/>
      <stop offset="52%" stop-color="#46505b"/>
      <stop offset="100%" stop-color="#080b0e"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#ddd9ce" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ddd9ce" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="39"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1167"
      cy="391"
      rx="355.3"
      ry="209"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="69" y1="294" x2="257" y2="685" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1566" y1="603" x2="734" y2="428" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="763" y1="556" x2="1003" y2="373" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="161" y1="650" x2="1470" y2="220" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="883" y1="584" x2="645" y2="884" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1287" y1="295" x2="436" y2="96" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="975" y1="164" x2="511" y2="12" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1184" y1="623" x2="504" y2="943" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="161" y1="5" x2="278" y2="597" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="909" y1="325" x2="633" y2="482" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1581" y1="830" x2="1554" y2="785" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1344" y1="186" x2="435" y2="935" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1136" y1="29" x2="1390" y2="785" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1565" y1="719" x2="48" y2="215" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="711" y1="987" x2="472" y2="486" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="792" y1="489" x2="815" y2="796" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/>
    <circle cx="99" cy="91" r="93" fill="#ddd9ce" opacity="0.103"/><circle cx="1186" cy="895" r="20" fill="#ddd9ce" opacity="0.061"/><circle cx="907" cy="507" r="86" fill="#ddd9ce" opacity="0.112"/><circle cx="860" cy="442" r="20" fill="#ddd9ce" opacity="0.039"/><circle cx="502" cy="283" r="20" fill="#ddd9ce" opacity="0.086"/><circle cx="1159" cy="759" r="71" fill="#ddd9ce" opacity="0.148"/><circle cx="1120" cy="477" r="18" fill="#ddd9ce" opacity="0.046"/><circle cx="477" cy="764" r="29" fill="#ddd9ce" opacity="0.099"/><circle cx="376" cy="405" r="27" fill="#ddd9ce" opacity="0.101"/><circle cx="1414" cy="409" r="104" fill="#ddd9ce" opacity="0.029"/><circle cx="1002" cy="836" r="87" fill="#ddd9ce" opacity="0.148"/><circle cx="1278" cy="869" r="100" fill="#ddd9ce" opacity="0.134"/><circle cx="1272" cy="188" r="17" fill="#ddd9ce" opacity="0.036"/><circle cx="96" cy="142" r="27" fill="#ddd9ce" opacity="0.108"/><circle cx="341" cy="156" r="62" fill="#ddd9ce" opacity="0.042"/><circle cx="499" cy="160" r="26" fill="#ddd9ce" opacity="0.031"/><circle cx="748" cy="292" r="95" fill="#ddd9ce" opacity="0.090"/><circle cx="707" cy="538" r="8" fill="#ddd9ce" opacity="0.093"/>
  </g>

  <g
    transform="translate(800 480) rotate(-15)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8295a6"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#ddd9ce"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#ddd9ce"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Llegada desde el mar
    </text>

    <text
      x="2"
      y="55"
      fill="#ddd9ce"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Los ausentes emergen
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8295a6"
      stroke-opacity="0.62"
    />
  </g>
</svg>