<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100f"/>
      <stop offset="52%" stop-color="#28433e"/>
      <stop offset="100%" stop-color="#07100f"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#c3c7b2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c3c7b2" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="34"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="471"
      cy="645"
      rx="414.8"
      ry="244"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="499" y1="530" x2="1434" y2="905" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="174" y1="632" x2="1475" y2="366" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="915" y1="596" x2="754" y2="936" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1560" y1="276" x2="27" y2="270" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1154" y1="917" x2="1067" y2="931" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1395" y1="662" x2="1387" y2="758" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1003" y1="791" x2="964" y2="542" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="646" y1="780" x2="1032" y2="63" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1435" y1="343" x2="840" y2="627" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1532" y1="434" x2="1346" y2="412" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1418" y1="117" x2="220" y2="634" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="326" y1="700" x2="514" y2="428" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="158" y1="101" x2="994" y2="263" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1042" y1="987" x2="698" y2="891" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1052" y1="229" x2="796" y2="684" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1536" y1="346" x2="921" y2="942" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/>
    <circle cx="1455" cy="741" r="45" fill="#c3c7b2" opacity="0.151"/><circle cx="881" cy="106" r="73" fill="#c3c7b2" opacity="0.093"/><circle cx="690" cy="187" r="31" fill="#c3c7b2" opacity="0.125"/><circle cx="91" cy="905" r="27" fill="#c3c7b2" opacity="0.109"/><circle cx="731" cy="863" r="105" fill="#c3c7b2" opacity="0.091"/><circle cx="1196" cy="722" r="96" fill="#c3c7b2" opacity="0.142"/><circle cx="661" cy="176" r="11" fill="#c3c7b2" opacity="0.063"/><circle cx="665" cy="840" r="43" fill="#c3c7b2" opacity="0.045"/><circle cx="740" cy="751" r="71" fill="#c3c7b2" opacity="0.051"/><circle cx="392" cy="671" r="33" fill="#c3c7b2" opacity="0.083"/><circle cx="1336" cy="402" r="64" fill="#c3c7b2" opacity="0.067"/><circle cx="469" cy="701" r="93" fill="#c3c7b2" opacity="0.146"/><circle cx="1213" cy="623" r="94" fill="#c3c7b2" opacity="0.133"/><circle cx="1509" cy="691" r="33" fill="#c3c7b2" opacity="0.061"/><circle cx="453" cy="214" r="42" fill="#c3c7b2" opacity="0.052"/><circle cx="661" cy="893" r="95" fill="#c3c7b2" opacity="0.061"/><circle cx="108" cy="657" r="69" fill="#c3c7b2" opacity="0.152"/><circle cx="193" cy="256" r="19" fill="#c3c7b2" opacity="0.044"/>
  </g>

  <g
    transform="translate(800 480) rotate(-18)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#805d4e"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#c3c7b2"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#c3c7b2"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Mercado de las Voces
    </text>

    <text
      x="2"
      y="55"
      fill="#c3c7b2"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Lo dicho adquiere precio
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
