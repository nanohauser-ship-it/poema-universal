<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b0e"/>
      <stop offset="52%" stop-color="#46505b"/>
      <stop offset="100%" stop-color="#080b0e"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#ddd9ce" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ddd9ce" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="27"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="910"
      cy="587"
      rx="258.4"
      ry="152"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="813" y1="202" x2="854" y2="730" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="531" y1="254" x2="880" y2="899" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="997" y1="606" x2="1485" y2="680" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="196" y1="528" x2="34" y2="121" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1409" y1="904" x2="1493" y2="143" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="857" y1="976" x2="1444" y2="689" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="87" y1="708" x2="524" y2="283" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="27" y1="124" x2="1392" y2="450" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1436" y1="743" x2="237" y2="232" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="957" y1="510" x2="805" y2="349" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="15" y1="693" x2="166" y2="687" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="301" y1="348" x2="1491" y2="997" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="858" y1="551" x2="1266" y2="849" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1336" y1="979" x2="1052" y2="28" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="358" y1="466" x2="1139" y2="997" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="52" y1="762" x2="1373" y2="423" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/>
    <circle cx="117" cy="352" r="69" fill="#ddd9ce" opacity="0.094"/><circle cx="430" cy="517" r="27" fill="#ddd9ce" opacity="0.057"/><circle cx="490" cy="445" r="82" fill="#ddd9ce" opacity="0.153"/><circle cx="881" cy="313" r="71" fill="#ddd9ce" opacity="0.129"/><circle cx="482" cy="598" r="44" fill="#ddd9ce" opacity="0.044"/><circle cx="1455" cy="210" r="55" fill="#ddd9ce" opacity="0.139"/><circle cx="1399" cy="232" r="76" fill="#ddd9ce" opacity="0.114"/><circle cx="1290" cy="385" r="95" fill="#ddd9ce" opacity="0.039"/><circle cx="720" cy="411" r="21" fill="#ddd9ce" opacity="0.037"/><circle cx="531" cy="621" r="38" fill="#ddd9ce" opacity="0.097"/><circle cx="763" cy="71" r="51" fill="#ddd9ce" opacity="0.072"/><circle cx="1225" cy="590" r="76" fill="#ddd9ce" opacity="0.059"/><circle cx="970" cy="155" r="43" fill="#ddd9ce" opacity="0.126"/><circle cx="1354" cy="306" r="73" fill="#ddd9ce" opacity="0.100"/><circle cx="1014" cy="853" r="31" fill="#ddd9ce" opacity="0.088"/><circle cx="913" cy="790" r="42" fill="#ddd9ce" opacity="0.041"/><circle cx="1390" cy="238" r="45" fill="#ddd9ce" opacity="0.149"/><circle cx="1232" cy="642" r="60" fill="#ddd9ce" opacity="0.050"/>
  </g>

  <g
    transform="translate(800 480) rotate(16)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8295a6"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#ddd9ce"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#ddd9ce"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Atlas en el camino
    </text>

    <text
      x="2"
      y="55"
      fill="#ddd9ce"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      La frontera entre los libros
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8295a6"
      stroke-opacity="0.62"
    />
  </g>
</svg>