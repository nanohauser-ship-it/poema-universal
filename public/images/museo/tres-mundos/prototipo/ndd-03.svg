<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d0a"/>
      <stop offset="52%" stop-color="#54432e"/>
      <stop offset="100%" stop-color="#100d0a"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#d4c29b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d4c29b" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="86"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1084"
      cy="503"
      rx="222.7"
      ry="131"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="768" y1="141" x2="964" y2="425" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="6" y1="43" x2="156" y2="375" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1387" y1="754" x2="1103" y2="989" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="947" y1="221" x2="487" y2="800" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1263" y1="696" x2="1181" y2="826" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1390" y1="468" x2="896" y2="720" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1154" y1="880" x2="1009" y2="320" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="121" y1="477" x2="1421" y2="87" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="634" y1="145" x2="1598" y2="731" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="949" y1="499" x2="39" y2="722" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1461" y1="997" x2="1588" y2="156" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="436" y1="18" x2="967" y2="922" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="568" y1="889" x2="1055" y2="247" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1568" y1="389" x2="901" y2="116" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1037" y1="218" x2="869" y2="560" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1527" y1="139" x2="1196" y2="388" stroke="#d4c29b" opacity="0.07" stroke-width="1"/>
    <circle cx="659" cy="119" r="56" fill="#d4c29b" opacity="0.071"/><circle cx="1232" cy="648" r="36" fill="#d4c29b" opacity="0.058"/><circle cx="179" cy="910" r="85" fill="#d4c29b" opacity="0.109"/><circle cx="918" cy="843" r="75" fill="#d4c29b" opacity="0.108"/><circle cx="1198" cy="707" r="35" fill="#d4c29b" opacity="0.118"/><circle cx="1273" cy="831" r="98" fill="#d4c29b" opacity="0.025"/><circle cx="103" cy="441" r="26" fill="#d4c29b" opacity="0.144"/><circle cx="1377" cy="348" r="98" fill="#d4c29b" opacity="0.145"/><circle cx="671" cy="408" r="44" fill="#d4c29b" opacity="0.054"/><circle cx="602" cy="824" r="39" fill="#d4c29b" opacity="0.040"/><circle cx="939" cy="127" r="73" fill="#d4c29b" opacity="0.145"/><circle cx="493" cy="391" r="25" fill="#d4c29b" opacity="0.130"/><circle cx="143" cy="645" r="41" fill="#d4c29b" opacity="0.052"/><circle cx="595" cy="362" r="12" fill="#d4c29b" opacity="0.092"/><circle cx="1484" cy="274" r="74" fill="#d4c29b" opacity="0.145"/><circle cx="688" cy="185" r="70" fill="#d4c29b" opacity="0.079"/><circle cx="437" cy="235" r="75" fill="#d4c29b" opacity="0.071"/><circle cx="936" cy="453" r="53" fill="#d4c29b" opacity="0.035"/>
  </g>

  <g
    transform="translate(800 480) rotate(-17)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8b6541"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#d4c29b"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#d4c29b"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      El cuaderno
    </text>

    <text
      x="2"
      y="55"
      fill="#d4c29b"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      La herida encuentra una página
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8b6541"
      stroke-opacity="0.62"
    />
