<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d0a"/>
      <stop offset="52%" stop-color="#54432e"/>
      <stop offset="100%" stop-color="#100d0a"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#d4c29b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d4c29b" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="27"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1101"
      cy="456"
      rx="338.3"
      ry="199"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="1484" y1="446" x2="1053" y2="701" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="753" y1="723" x2="1308" y2="901" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="480" y1="167" x2="1436" y2="319" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="171" y1="5" x2="948" y2="375" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="211" y1="22" x2="495" y2="892" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="816" y1="842" x2="537" y2="28" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="346" y1="558" x2="94" y2="819" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="691" y1="405" x2="1067" y2="753" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1078" y1="6" x2="1145" y2="560" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="865" y1="377" x2="1400" y2="283" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="318" y1="77" x2="1" y2="385" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1032" y1="618" x2="628" y2="494" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="440" y1="561" x2="554" y2="177" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="371" y1="42" x2="1423" y2="797" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="391" y1="349" x2="1585" y2="751" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="162" y1="760" x2="200" y2="253" stroke="#d4c29b" opacity="0.07" stroke-width="1"/>
    <circle cx="787" cy="392" r="57" fill="#d4c29b" opacity="0.131"/><circle cx="581" cy="894" r="14" fill="#d4c29b" opacity="0.136"/><circle cx="1420" cy="847" r="105" fill="#d4c29b" opacity="0.090"/><circle cx="701" cy="307" r="87" fill="#d4c29b" opacity="0.149"/><circle cx="605" cy="259" r="93" fill="#d4c29b" opacity="0.159"/><circle cx="1270" cy="578" r="63" fill="#d4c29b" opacity="0.082"/><circle cx="187" cy="647" r="63" fill="#d4c29b" opacity="0.070"/><circle cx="245" cy="749" r="97" fill="#d4c29b" opacity="0.072"/><circle cx="1085" cy="631" r="14" fill="#d4c29b" opacity="0.109"/><circle cx="1092" cy="739" r="9" fill="#d4c29b" opacity="0.157"/><circle cx="855" cy="630" r="52" fill="#d4c29b" opacity="0.154"/><circle cx="1469" cy="620" r="56" fill="#d4c29b" opacity="0.046"/><circle cx="1265" cy="172" r="96" fill="#d4c29b" opacity="0.085"/><circle cx="584" cy="721" r="102" fill="#d4c29b" opacity="0.142"/><circle cx="828" cy="144" r="34" fill="#d4c29b" opacity="0.079"/><circle cx="926" cy="741" r="89" fill="#d4c29b" opacity="0.035"/><circle cx="129" cy="878" r="55" fill="#d4c29b" opacity="0.085"/><circle cx="779" cy="376" r="101" fill="#d4c29b" opacity="0.140"/>
  </g>

  <g
    transform="translate(800 480) rotate(16)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8b6541"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#d4c29b"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#d4c29b"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Las siete reliquias
    </text>

    <text
      x="2"
      y="55"
      fill="#d4c29b"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Objetos contra la desaparición
    </text>

    <line
