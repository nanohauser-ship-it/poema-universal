<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d0a"/>
      <stop offset="52%" stop-color="#54432e"/>
      <stop offset="100%" stop-color="#100d0a"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#d4c29b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d4c29b" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="12"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="560"
      cy="285"
      rx="370.59999999999997"
      ry="218"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="373" y1="889" x2="1309" y2="210" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="404" y1="682" x2="1104" y2="820" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1150" y1="627" x2="75" y2="411" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1597" y1="391" x2="1410" y2="963" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="669" y1="279" x2="882" y2="131" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1544" y1="183" x2="595" y2="412" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="79" y1="352" x2="20" y2="933" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="756" y1="368" x2="1057" y2="678" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="20" y1="808" x2="475" y2="158" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1333" y1="825" x2="894" y2="620" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="216" y1="584" x2="1214" y2="644" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="985" y1="12" x2="1119" y2="250" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="426" y1="134" x2="644" y2="544" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="257" y1="514" x2="492" y2="921" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="966" y1="321" x2="1318" y2="849" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="836" y1="261" x2="1106" y2="94" stroke="#d4c29b" opacity="0.07" stroke-width="1"/>
    <circle cx="508" cy="682" r="16" fill="#d4c29b" opacity="0.028"/><circle cx="425" cy="256" r="92" fill="#d4c29b" opacity="0.044"/><circle cx="544" cy="809" r="81" fill="#d4c29b" opacity="0.135"/><circle cx="1013" cy="408" r="42" fill="#d4c29b" opacity="0.140"/><circle cx="1361" cy="831" r="69" fill="#d4c29b" opacity="0.113"/><circle cx="1484" cy="886" r="57" fill="#d4c29b" opacity="0.160"/><circle cx="1505" cy="597" r="76" fill="#d4c29b" opacity="0.050"/><circle cx="593" cy="452" r="59" fill="#d4c29b" opacity="0.052"/><circle cx="1017" cy="479" r="14" fill="#d4c29b" opacity="0.084"/><circle cx="90" cy="779" r="22" fill="#d4c29b" opacity="0.126"/><circle cx="1413" cy="310" r="51" fill="#d4c29b" opacity="0.035"/><circle cx="1260" cy="136" r="59" fill="#d4c29b" opacity="0.047"/><circle cx="1294" cy="348" r="56" fill="#d4c29b" opacity="0.110"/><circle cx="769" cy="235" r="101" fill="#d4c29b" opacity="0.119"/><circle cx="306" cy="323" r="10" fill="#d4c29b" opacity="0.107"/><circle cx="750" cy="401" r="41" fill="#d4c29b" opacity="0.049"/><circle cx="164" cy="862" r="22" fill="#d4c29b" opacity="0.072"/><circle cx="1420" cy="893" r="64" fill="#d4c29b" opacity="0.146"/>
  </g>

  <g
    transform="translate(800 480) rotate(-19)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8b6541"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#d4c29b"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#d4c29b"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Bajo las ramas
    </text>

    <text
      x="2"
      y="55"
      fill="#d4c29b"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Una presencia que el árbol no olvida
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8b6541"
      stroke-opacity="0.62"
    />
