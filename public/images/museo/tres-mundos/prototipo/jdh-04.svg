<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100f"/>
      <stop offset="52%" stop-color="#28433e"/>
      <stop offset="100%" stop-color="#07100f"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#c3c7b2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c3c7b2" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="4"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="685"
      cy="498"
      rx="328.09999999999997"
      ry="193"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="116" y1="771" x2="1543" y2="238" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="279" y1="724" x2="486" y2="744" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="385" y1="248" x2="204" y2="392" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1336" y1="960" x2="899" y2="200" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="723" y1="503" x2="193" y2="459" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="465" y1="876" x2="574" y2="611" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="272" y1="996" x2="1080" y2="164" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="319" y1="801" x2="108" y2="494" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1123" y1="778" x2="997" y2="505" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1186" y1="688" x2="998" y2="366" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1499" y1="337" x2="1563" y2="517" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="374" y1="19" x2="1586" y2="83" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="571" y1="673" x2="1029" y2="618" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1113" y1="47" x2="1108" y2="522" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="521" y1="125" x2="937" y2="239" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="895" y1="621" x2="683" y2="762" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/>
    <circle cx="532" cy="763" r="55" fill="#c3c7b2" opacity="0.048"/><circle cx="1126" cy="797" r="43" fill="#c3c7b2" opacity="0.147"/><circle cx="602" cy="625" r="53" fill="#c3c7b2" opacity="0.093"/><circle cx="371" cy="151" r="35" fill="#c3c7b2" opacity="0.061"/><circle cx="511" cy="497" r="34" fill="#c3c7b2" opacity="0.069"/><circle cx="353" cy="270" r="43" fill="#c3c7b2" opacity="0.152"/><circle cx="1009" cy="796" r="73" fill="#c3c7b2" opacity="0.101"/><circle cx="345" cy="196" r="27" fill="#c3c7b2" opacity="0.049"/><circle cx="816" cy="169" r="95" fill="#c3c7b2" opacity="0.079"/><circle cx="459" cy="263" r="66" fill="#c3c7b2" opacity="0.082"/><circle cx="1482" cy="161" r="48" fill="#c3c7b2" opacity="0.102"/><circle cx="735" cy="281" r="9" fill="#c3c7b2" opacity="0.102"/><circle cx="410" cy="755" r="84" fill="#c3c7b2" opacity="0.079"/><circle cx="1193" cy="476" r="102" fill="#c3c7b2" opacity="0.150"/><circle cx="248" cy="680" r="25" fill="#c3c7b2" opacity="0.092"/><circle cx="830" cy="556" r="72" fill="#c3c7b2" opacity="0.046"/><circle cx="651" cy="281" r="55" fill="#c3c7b2" opacity="0.028"/><circle cx="817" cy="620" r="72" fill="#c3c7b2" opacity="0.138"/>
  </g>

  <g
    transform="translate(800 480) rotate(15)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#805d4e"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
