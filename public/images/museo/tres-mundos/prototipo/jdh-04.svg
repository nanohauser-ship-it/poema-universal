    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#c3c7b2"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#c3c7b2"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Farmacia de la Morfina
    </text>

    <text
      x="2"
      y="55"
      fill="#c3c7b2"
      fill-opacity="0.58"
      font-family="Georgia, serif"
