<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b0e"/>
      <stop offset="52%" stop-color="#46505b"/>
      <stop offset="100%" stop-color="#080b0e"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#ddd9ce" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ddd9ce" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="24"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1044"
      cy="488"
      rx="323.0"
      ry="190"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="899" y1="394" x2="1483" y2="115" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="670" y1="968" x2="106" y2="348" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="736" y1="932" x2="408" y2="74" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="906" y1="695" x2="122" y2="610" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="601" y1="700" x2="995" y2="48" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="315" y1="171" x2="314" y2="885" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="355" y1="805" x2="1461" y2="844" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="110" y1="351" x2="598" y2="321" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="219" y1="665" x2="895" y2="388" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="109" y1="85" x2="1427" y2="685" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="392" y1="835" x2="229" y2="327" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="367" y1="899" x2="242" y2="81" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="171" y1="669" x2="978" y2="727" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1015" y1="744" x2="1350" y2="79" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1217" y1="515" x2="57" y2="632" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1121" y1="926" x2="1370" y2="556" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/>
    <circle cx="192" cy="568" r="36" fill="#ddd9ce" opacity="0.158"/><circle cx="987" cy="905" r="49" fill="#ddd9ce" opacity="0.101"/><circle cx="1168" cy="873" r="99" fill="#ddd9ce" opacity="0.044"/><circle cx="687" cy="530" r="19" fill="#ddd9ce" opacity="0.091"/><circle cx="613" cy="744" r="42" fill="#ddd9ce" opacity="0.155"/><circle cx="1269" cy="706" r="44" fill="#ddd9ce" opacity="0.061"/><circle cx="1249" cy="867" r="93" fill="#ddd9ce" opacity="0.108"/><circle cx="1122" cy="125" r="25" fill="#ddd9ce" opacity="0.124"/><circle cx="99" cy="212" r="43" fill="#ddd9ce" opacity="0.040"/><circle cx="932" cy="600" r="96" fill="#ddd9ce" opacity="0.052"/><circle cx="1413" cy="694" r="76" fill="#ddd9ce" opacity="0.086"/><circle cx="463" cy="622" r="65" fill="#ddd9ce" opacity="0.085"/><circle cx="365" cy="240" r="96" fill="#ddd9ce" opacity="0.145"/><circle cx="657" cy="99" r="94" fill="#ddd9ce" opacity="0.132"/><circle cx="994" cy="892" r="84" fill="#ddd9ce" opacity="0.051"/><circle cx="377" cy="72" r="77" fill="#ddd9ce" opacity="0.102"/><circle cx="691" cy="511" r="88" fill="#ddd9ce" opacity="0.027"/><circle cx="368" cy="436" r="79" fill="#ddd9ce" opacity="0.130"/>
  </g>

  <g
    transform="translate(800 480) rotate(19)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8295a6"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#ddd9ce"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#ddd9ce"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      La puerta de piedra
    </text>

    <text
      x="2"
      y="55"
      fill="#ddd9ce"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Cruzar sin vencer
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8295a6"
      stroke-opacity="0.62"
    />
  </g>
</svg>