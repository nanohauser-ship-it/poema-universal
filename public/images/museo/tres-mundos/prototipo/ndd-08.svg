<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d0a"/>
      <stop offset="52%" stop-color="#54432e"/>
      <stop offset="100%" stop-color="#100d0a"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#d4c29b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d4c29b" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="60"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="729"
      cy="311"
      rx="346.8"
      ry="204"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="454" y1="763" x2="1462" y2="567" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="854" y1="141" x2="1490" y2="247" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="236" y1="334" x2="1068" y2="729" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1424" y1="112" x2="1078" y2="215" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1587" y1="363" x2="473" y2="336" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1198" y1="765" x2="467" y2="196" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="382" y1="53" x2="725" y2="469" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1188" y1="865" x2="442" y2="53" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="355" y1="454" x2="1477" y2="487" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="440" y1="538" x2="1377" y2="537" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="31" y1="802" x2="79" y2="998" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="24" y1="536" x2="1575" y2="108" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1164" y1="442" x2="584" y2="680" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1472" y1="108" x2="121" y2="639" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1397" y1="953" x2="981" y2="246" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="464" y1="151" x2="346" y2="240" stroke="#d4c29b" opacity="0.07" stroke-width="1"/>
    <circle cx="1195" cy="444" r="37" fill="#d4c29b" opacity="0.157"/><circle cx="1331" cy="748" r="14" fill="#d4c29b" opacity="0.071"/><circle cx="1302" cy="636" r="51" fill="#d4c29b" opacity="0.050"/><circle cx="1237" cy="128" r="33" fill="#d4c29b" opacity="0.088"/><circle cx="1347" cy="901" r="8" fill="#d4c29b" opacity="0.129"/><circle cx="245" cy="112" r="66" fill="#d4c29b" opacity="0.060"/><circle cx="695" cy="892" r="46" fill="#d4c29b" opacity="0.152"/><circle cx="438" cy="825" r="21" fill="#d4c29b" opacity="0.101"/><circle cx="696" cy="407" r="12" fill="#d4c29b" opacity="0.128"/><circle cx="266" cy="383" r="24" fill="#d4c29b" opacity="0.036"/><circle cx="992" cy="354" r="43" fill="#d4c29b" opacity="0.069"/><circle cx="1456" cy="560" r="73" fill="#d4c29b" opacity="0.091"/><circle cx="294" cy="145" r="91" fill="#d4c29b" opacity="0.029"/><circle cx="801" cy="238" r="36" fill="#d4c29b" opacity="0.116"/><circle cx="879" cy="702" r="66" fill="#d4c29b" opacity="0.108"/><circle cx="771" cy="537" r="98" fill="#d4c29b" opacity="0.070"/><circle cx="172" cy="503" r="59" fill="#d4c29b" opacity="0.117"/><circle cx="447" cy="596" r="14" fill="#d4c29b" opacity="0.080"/>
  </g>

  <g
    transform="translate(800 480) rotate(10)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8b6541"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#d4c29b"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#d4c29b"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Después del fuego
    </text>

    <text
      x="2"
      y="55"
      fill="#d4c29b"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      El árbol continúa
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8b6541"
      stroke-opacity="0.62"
    />
  </g>
</svg>