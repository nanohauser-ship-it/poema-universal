<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b0e"/>
      <stop offset="52%" stop-color="#46505b"/>
      <stop offset="100%" stop-color="#080b0e"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#ddd9ce" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ddd9ce" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="91"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="530"
      cy="645"
      rx="317.9"
      ry="187"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="1559" y1="902" x2="283" y2="847" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="30" y1="737" x2="493" y2="637" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="957" y1="714" x2="1332" y2="546" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1104" y1="735" x2="1116" y2="66" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="392" y1="696" x2="864" y2="576" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1085" y1="474" x2="989" y2="833" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="435" y1="818" x2="928" y2="960" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1059" y1="666" x2="1350" y2="749" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1473" y1="410" x2="1316" y2="765" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="283" y1="895" x2="199" y2="658" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="469" y1="590" x2="429" y2="997" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="464" y1="897" x2="1275" y2="87" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1111" y1="501" x2="1418" y2="464" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="393" y1="598" x2="298" y2="348" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="577" y1="50" x2="160" y2="209" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="922" y1="542" x2="1578" y2="622" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/>
    <circle cx="590" cy="107" r="46" fill="#ddd9ce" opacity="0.104"/><circle cx="792" cy="286" r="13" fill="#ddd9ce" opacity="0.086"/><circle cx="1209" cy="160" r="74" fill="#ddd9ce" opacity="0.130"/><circle cx="280" cy="72" r="91" fill="#ddd9ce" opacity="0.118"/><circle cx="620" cy="689" r="105" fill="#ddd9ce" opacity="0.109"/><circle cx="1285" cy="828" r="25" fill="#ddd9ce" opacity="0.054"/><circle cx="1093" cy="370" r="59" fill="#ddd9ce" opacity="0.067"/><circle cx="1150" cy="662" r="95" fill="#ddd9ce" opacity="0.106"/><circle cx="716" cy="581" r="103" fill="#ddd9ce" opacity="0.073"/><circle cx="1492" cy="454" r="36" fill="#ddd9ce" opacity="0.118"/><circle cx="976" cy="458" r="52" fill="#ddd9ce" opacity="0.074"/><circle cx="1120" cy="365" r="104" fill="#ddd9ce" opacity="0.119"/><circle cx="731" cy="499" r="94" fill="#ddd9ce" opacity="0.098"/><circle cx="257" cy="877" r="27" fill="#ddd9ce" opacity="0.029"/><circle cx="341" cy="526" r="76" fill="#ddd9ce" opacity="0.041"/><circle cx="1015" cy="620" r="20" fill="#ddd9ce" opacity="0.062"/><circle cx="1443" cy="854" r="8" fill="#ddd9ce" opacity="0.079"/><circle cx="1036" cy="144" r="95" fill="#ddd9ce" opacity="0.059"/>
  </g>

  <g
    transform="translate(800 480) rotate(4)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8295a6"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#ddd9ce"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#ddd9ce"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      El Minotauro albino
    </text>

    <text
      x="2"
      y="55"
      fill="#ddd9ce"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      La criatura no vencida
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8295a6"
      stroke-opacity="0.62"
    />
  </g>
</svg>