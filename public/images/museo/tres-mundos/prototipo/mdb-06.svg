<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b0e"/>
      <stop offset="52%" stop-color="#46505b"/>
      <stop offset="100%" stop-color="#080b0e"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#ddd9ce" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ddd9ce" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="79"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="548"
      cy="506"
      rx="248.2"
      ry="146"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="1519" y1="789" x2="893" y2="551" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="704" y1="89" x2="548" y2="123" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="420" y1="771" x2="305" y2="505" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1118" y1="223" x2="574" y2="918" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="22" y1="418" x2="338" y2="599" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1169" y1="569" x2="626" y2="923" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1389" y1="55" x2="989" y2="355" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="131" y1="871" x2="582" y2="980" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1569" y1="475" x2="502" y2="187" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1227" y1="304" x2="882" y2="613" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="854" y1="420" x2="239" y2="930" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="401" y1="647" x2="893" y2="14" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1296" y1="203" x2="270" y2="686" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1546" y1="657" x2="369" y2="143" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="748" y1="495" x2="1472" y2="979" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1029" y1="656" x2="353" y2="770" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/>
    <circle cx="948" cy="861" r="16" fill="#ddd9ce" opacity="0.149"/><circle cx="1079" cy="730" r="93" fill="#ddd9ce" opacity="0.112"/><circle cx="1206" cy="459" r="81" fill="#ddd9ce" opacity="0.085"/><circle cx="726" cy="602" r="26" fill="#ddd9ce" opacity="0.030"/><circle cx="458" cy="610" r="65" fill="#ddd9ce" opacity="0.134"/><circle cx="267" cy="150" r="75" fill="#ddd9ce" opacity="0.051"/><circle cx="794" cy="480" r="15" fill="#ddd9ce" opacity="0.118"/><circle cx="739" cy="760" r="93" fill="#ddd9ce" opacity="0.118"/><circle cx="798" cy="378" r="91" fill="#ddd9ce" opacity="0.079"/><circle cx="1507" cy="855" r="74" fill="#ddd9ce" opacity="0.121"/><circle cx="348" cy="444" r="53" fill="#ddd9ce" opacity="0.027"/><circle cx="106" cy="445" r="36" fill="#ddd9ce" opacity="0.033"/><circle cx="1079" cy="321" r="89" fill="#ddd9ce" opacity="0.111"/><circle cx="237" cy="117" r="56" fill="#ddd9ce" opacity="0.087"/><circle cx="1036" cy="459" r="46" fill="#ddd9ce" opacity="0.080"/><circle cx="408" cy="544" r="88" fill="#ddd9ce" opacity="0.098"/><circle cx="1074" cy="838" r="30" fill="#ddd9ce" opacity="0.050"/><circle cx="308" cy="582" r="79" fill="#ddd9ce" opacity="0.063"/>
  </g>

  <g
    transform="translate(800 480) rotate(14)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8295a6"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#ddd9ce"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#ddd9ce"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      El mensaje del muro
    </text>

    <text
      x="2"
      y="55"
      fill="#ddd9ce"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Yo no os olvidé
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8295a6"
      stroke-opacity="0.62"
    />
  </g>
</svg>