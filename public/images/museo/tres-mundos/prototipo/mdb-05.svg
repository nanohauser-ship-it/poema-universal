<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b0e"/>
      <stop offset="52%" stop-color="#46505b"/>
      <stop offset="100%" stop-color="#080b0e"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#ddd9ce" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ddd9ce" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="19"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="699"
      cy="552"
      rx="280.5"
      ry="165"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="225" y1="914" x2="137" y2="153" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="558" y1="768" x2="1276" y2="383" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="701" y1="980" x2="1227" y2="514" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1056" y1="865" x2="267" y2="838" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="536" y1="253" x2="1023" y2="391" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="342" y1="709" x2="1332" y2="421" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="551" y1="821" x2="1025" y2="914" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1495" y1="676" x2="682" y2="510" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1018" y1="142" x2="175" y2="49" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1380" y1="569" x2="1456" y2="18" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="864" y1="651" x2="1159" y2="635" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="77" y1="164" x2="1286" y2="649" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1505" y1="843" x2="623" y2="910" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1489" y1="786" x2="56" y2="337" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="545" y1="937" x2="1402" y2="345" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="346" y1="72" x2="1257" y2="547" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/>
    <circle cx="536" cy="111" r="58" fill="#ddd9ce" opacity="0.149"/><circle cx="512" cy="150" r="58" fill="#ddd9ce" opacity="0.081"/><circle cx="795" cy="745" r="17" fill="#ddd9ce" opacity="0.133"/><circle cx="299" cy="655" r="81" fill="#ddd9ce" opacity="0.105"/><circle cx="891" cy="850" r="18" fill="#ddd9ce" opacity="0.096"/><circle cx="1501" cy="185" r="28" fill="#ddd9ce" opacity="0.147"/><circle cx="263" cy="135" r="57" fill="#ddd9ce" opacity="0.027"/><circle cx="707" cy="668" r="42" fill="#ddd9ce" opacity="0.056"/><circle cx="1356" cy="599" r="79" fill="#ddd9ce" opacity="0.034"/><circle cx="1315" cy="143" r="45" fill="#ddd9ce" opacity="0.031"/><circle cx="867" cy="334" r="99" fill="#ddd9ce" opacity="0.159"/><circle cx="1086" cy="464" r="100" fill="#ddd9ce" opacity="0.081"/><circle cx="913" cy="485" r="99" fill="#ddd9ce" opacity="0.121"/><circle cx="380" cy="779" r="9" fill="#ddd9ce" opacity="0.121"/><circle cx="913" cy="438" r="18" fill="#ddd9ce" opacity="0.041"/><circle cx="1417" cy="633" r="29" fill="#ddd9ce" opacity="0.063"/><circle cx="1056" cy="399" r="52" fill="#ddd9ce" opacity="0.041"/><circle cx="551" cy="119" r="75" fill="#ddd9ce" opacity="0.050"/>
  </g>

  <g
    transform="translate(800 480) rotate(-19)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8295a6"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#ddd9ce"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#ddd9ce"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Madres de la Memoria
    </text>

    <text
      x="2"
      y="55"
      fill="#ddd9ce"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Cuatro convocadas
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8295a6"
      stroke-opacity="0.62"
    />
  </g>
</svg>