<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100f"/>
      <stop offset="52%" stop-color="#28433e"/>
      <stop offset="100%" stop-color="#07100f"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#c3c7b2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c3c7b2" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="26"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="861"
      cy="555"
      rx="374.0"
      ry="220"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="434" y1="430" x2="993" y2="618" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="976" y1="350" x2="815" y2="558" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1528" y1="791" x2="287" y2="743" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="983" y1="810" x2="444" y2="888" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="557" y1="566" x2="1486" y2="171" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1422" y1="606" x2="403" y2="533" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="897" y1="736" x2="825" y2="918" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="31" y1="263" x2="838" y2="439" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="909" y1="642" x2="359" y2="27" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1562" y1="574" x2="488" y2="893" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="180" y1="285" x2="1564" y2="536" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1171" y1="487" x2="368" y2="771" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1283" y1="434" x2="316" y2="807" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="309" y1="470" x2="986" y2="645" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="393" y1="735" x2="1295" y2="123" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1172" y1="478" x2="461" y2="222" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/>
    <circle cx="1225" cy="808" r="46" fill="#c3c7b2" opacity="0.105"/><circle cx="661" cy="188" r="102" fill="#c3c7b2" opacity="0.115"/><circle cx="171" cy="631" r="37" fill="#c3c7b2" opacity="0.060"/><circle cx="1281" cy="93" r="104" fill="#c3c7b2" opacity="0.151"/><circle cx="646" cy="401" r="36" fill="#c3c7b2" opacity="0.084"/><circle cx="639" cy="594" r="18" fill="#c3c7b2" opacity="0.070"/><circle cx="383" cy="428" r="17" fill="#c3c7b2" opacity="0.055"/><circle cx="1078" cy="492" r="39" fill="#c3c7b2" opacity="0.070"/><circle cx="430" cy="884" r="73" fill="#c3c7b2" opacity="0.038"/><circle cx="321" cy="578" r="60" fill="#c3c7b2" opacity="0.056"/><circle cx="1360" cy="448" r="59" fill="#c3c7b2" opacity="0.059"/><circle cx="827" cy="290" r="88" fill="#c3c7b2" opacity="0.034"/><circle cx="301" cy="394" r="99" fill="#c3c7b2" opacity="0.094"/><circle cx="1041" cy="576" r="79" fill="#c3c7b2" opacity="0.028"/><circle cx="446" cy="313" r="10" fill="#c3c7b2" opacity="0.143"/><circle cx="545" cy="751" r="77" fill="#c3c7b2" opacity="0.134"/><circle cx="1241" cy="798" r="64" fill="#c3c7b2" opacity="0.117"/><circle cx="874" cy="894" r="39" fill="#c3c7b2" opacity="0.026"/>
  </g>

  <g
    transform="translate(800 480) rotate(-4)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#805d4e"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#c3c7b2"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#c3c7b2"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      La frutería
    </text>

    <text
      x="2"
      y="55"
      fill="#c3c7b2"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Barcelona antes del descenso
