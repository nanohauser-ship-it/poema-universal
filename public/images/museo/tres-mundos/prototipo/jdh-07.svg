<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100f"/>
      <stop offset="52%" stop-color="#28433e"/>
      <stop offset="100%" stop-color="#07100f"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#c3c7b2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c3c7b2" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="29"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="270"
      cy="631"
      rx="248.2"
      ry="146"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="947" y1="204" x2="836" y2="257" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="439" y1="704" x2="661" y2="860" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="487" y1="808" x2="1007" y2="529" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="301" y1="470" x2="658" y2="341" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="9" y1="124" x2="204" y2="855" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="371" y1="664" x2="787" y2="950" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="24" y1="984" x2="1448" y2="747" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="535" y1="998" x2="757" y2="237" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="866" y1="797" x2="1092" y2="328" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="964" y1="612" x2="866" y2="175" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1085" y1="456" x2="1380" y2="915" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1204" y1="409" x2="1012" y2="386" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1291" y1="968" x2="794" y2="757" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="147" y1="320" x2="6" y2="968" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1573" y1="974" x2="1449" y2="253" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="719" y1="323" x2="1577" y2="470" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/>
    <circle cx="444" cy="295" r="45" fill="#c3c7b2" opacity="0.088"/><circle cx="927" cy="509" r="69" fill="#c3c7b2" opacity="0.076"/><circle cx="1256" cy="341" r="39" fill="#c3c7b2" opacity="0.064"/><circle cx="533" cy="722" r="79" fill="#c3c7b2" opacity="0.050"/><circle cx="220" cy="239" r="71" fill="#c3c7b2" opacity="0.136"/><circle cx="937" cy="435" r="10" fill="#c3c7b2" opacity="0.029"/><circle cx="123" cy="633" r="9" fill="#c3c7b2" opacity="0.054"/><circle cx="96" cy="653" r="95" fill="#c3c7b2" opacity="0.096"/><circle cx="179" cy="610" r="63" fill="#c3c7b2" opacity="0.143"/><circle cx="426" cy="455" r="80" fill="#c3c7b2" opacity="0.145"/><circle cx="1446" cy="812" r="16" fill="#c3c7b2" opacity="0.081"/><circle cx="139" cy="102" r="76" fill="#c3c7b2" opacity="0.140"/><circle cx="307" cy="649" r="70" fill="#c3c7b2" opacity="0.035"/><circle cx="207" cy="387" r="70" fill="#c3c7b2" opacity="0.049"/><circle cx="1407" cy="434" r="85" fill="#c3c7b2" opacity="0.048"/><circle cx="1359" cy="524" r="24" fill="#c3c7b2" opacity="0.132"/><circle cx="1016" cy="99" r="90" fill="#c3c7b2" opacity="0.122"/><circle cx="1437" cy="171" r="89" fill="#c3c7b2" opacity="0.133"/>
  </g>

  <g
    transform="translate(800 480) rotate(5)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#805d4e"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#c3c7b2"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#c3c7b2"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Mesa de la Jerarquía
    </text>

    <text
      x="2"
      y="55"
      fill="#c3c7b2"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      El hambre encuentra su orden
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#805d4e"
      stroke-opacity="0.62"
    />
