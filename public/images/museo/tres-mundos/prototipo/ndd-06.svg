<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d0a"/>
      <stop offset="52%" stop-color="#54432e"/>
      <stop offset="100%" stop-color="#100d0a"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#d4c29b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d4c29b" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="0"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1035"
      cy="251"
      rx="265.2"
      ry="156"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="1244" y1="719" x2="1585" y2="116" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1066" y1="780" x2="839" y2="535" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1539" y1="386" x2="772" y2="249" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="545" y1="224" x2="1366" y2="401" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="631" y1="614" x2="975" y2="603" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="774" y1="148" x2="1532" y2="991" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1188" y1="502" x2="1598" y2="1000" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="193" y1="923" x2="687" y2="215" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="539" y1="240" x2="949" y2="431" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="691" y1="510" x2="355" y2="321" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1322" y1="285" x2="1148" y2="512" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="669" y1="388" x2="1481" y2="521" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="742" y1="466" x2="71" y2="734" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="46" y1="148" x2="786" y2="425" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="255" y1="285" x2="637" y2="733" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1286" y1="220" x2="1481" y2="330" stroke="#d4c29b" opacity="0.07" stroke-width="1"/>
    <circle cx="678" cy="135" r="66" fill="#d4c29b" opacity="0.073"/><circle cx="1368" cy="93" r="104" fill="#d4c29b" opacity="0.036"/><circle cx="1011" cy="773" r="77" fill="#d4c29b" opacity="0.055"/><circle cx="626" cy="237" r="38" fill="#d4c29b" opacity="0.136"/><circle cx="135" cy="385" r="84" fill="#d4c29b" opacity="0.159"/><circle cx="84" cy="393" r="66" fill="#d4c29b" opacity="0.036"/><circle cx="1494" cy="630" r="54" fill="#d4c29b" opacity="0.095"/><circle cx="1113" cy="313" r="43" fill="#d4c29b" opacity="0.061"/><circle cx="792" cy="718" r="91" fill="#d4c29b" opacity="0.154"/><circle cx="169" cy="410" r="43" fill="#d4c29b" opacity="0.132"/><circle cx="1417" cy="318" r="37" fill="#d4c29b" opacity="0.105"/><circle cx="1072" cy="738" r="26" fill="#d4c29b" opacity="0.133"/><circle cx="1055" cy="627" r="15" fill="#d4c29b" opacity="0.131"/><circle cx="908" cy="140" r="81" fill="#d4c29b" opacity="0.114"/><circle cx="818" cy="222" r="20" fill="#d4c29b" opacity="0.157"/><circle cx="833" cy="326" r="31" fill="#d4c29b" opacity="0.033"/><circle cx="1455" cy="741" r="55" fill="#d4c29b" opacity="0.092"/><circle cx="358" cy="204" r="29" fill="#d4c29b" opacity="0.123"/>
  </g>

  <g
    transform="translate(800 480) rotate(-14)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8b6541"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#d4c29b"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#d4c29b"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Argelia
    </text>

    <text
      x="2"
      y="55"
      fill="#d4c29b"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      La luz de la última enseñanza
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8b6541"
      stroke-opacity="0.62"
    />
  </g>
</svg>