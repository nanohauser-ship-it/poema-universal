<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b0e"/>
      <stop offset="52%" stop-color="#46505b"/>
      <stop offset="100%" stop-color="#080b0e"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#ddd9ce" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ddd9ce" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="69"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1216"
      cy="520"
      rx="394.4"
      ry="232"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="221" y1="492" x2="1293" y2="445" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1009" y1="810" x2="967" y2="726" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1072" y1="750" x2="1543" y2="299" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="542" y1="861" x2="954" y2="868" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1417" y1="679" x2="731" y2="968" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1499" y1="181" x2="387" y2="741" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="905" y1="931" x2="1296" y2="997" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1254" y1="832" x2="199" y2="776" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="828" y1="251" x2="1415" y2="825" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="176" y1="996" x2="356" y2="997" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="651" y1="970" x2="1070" y2="944" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="600" y1="613" x2="434" y2="147" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1045" y1="318" x2="903" y2="137" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="748" y1="292" x2="355" y2="577" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="837" y1="306" x2="1007" y2="290" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="179" y1="855" x2="857" y2="823" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/>
    <circle cx="416" cy="344" r="86" fill="#ddd9ce" opacity="0.119"/><circle cx="1206" cy="678" r="14" fill="#ddd9ce" opacity="0.094"/><circle cx="1178" cy="463" r="52" fill="#ddd9ce" opacity="0.133"/><circle cx="820" cy="495" r="81" fill="#ddd9ce" opacity="0.133"/><circle cx="959" cy="265" r="89" fill="#ddd9ce" opacity="0.044"/><circle cx="875" cy="333" r="97" fill="#ddd9ce" opacity="0.144"/><circle cx="1053" cy="803" r="50" fill="#ddd9ce" opacity="0.100"/><circle cx="1010" cy="565" r="52" fill="#ddd9ce" opacity="0.054"/><circle cx="1435" cy="196" r="36" fill="#ddd9ce" opacity="0.124"/><circle cx="775" cy="527" r="10" fill="#ddd9ce" opacity="0.142"/><circle cx="1239" cy="180" r="22" fill="#ddd9ce" opacity="0.098"/><circle cx="996" cy="354" r="29" fill="#ddd9ce" opacity="0.160"/><circle cx="1424" cy="652" r="91" fill="#ddd9ce" opacity="0.095"/><circle cx="716" cy="502" r="52" fill="#ddd9ce" opacity="0.135"/><circle cx="791" cy="126" r="26" fill="#ddd9ce" opacity="0.122"/><circle cx="1366" cy="459" r="84" fill="#ddd9ce" opacity="0.081"/><circle cx="388" cy="581" r="82" fill="#ddd9ce" opacity="0.117"/><circle cx="967" cy="828" r="17" fill="#ddd9ce" opacity="0.074"/>
  </g>

  <g
    transform="translate(800 480) rotate(-12)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8295a6"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#ddd9ce"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#ddd9ce"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Los zapatos de Lev
    </text>

    <text
      x="2"
      y="55"
      fill="#ddd9ce"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      El regreso imposible
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8295a6"
      stroke-opacity="0.62"
    />
  </g>
</svg>