<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d0a"/>
      <stop offset="52%" stop-color="#54432e"/>
      <stop offset="100%" stop-color="#100d0a"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#d4c29b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d4c29b" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="6"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1002"
      cy="665"
      rx="243.1"
      ry="143"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="801" y1="708" x2="937" y2="954" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="70" y1="820" x2="207" y2="948" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="137" y1="650" x2="91" y2="884" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="381" y1="683" x2="1437" y2="486" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1" y1="656" x2="518" y2="223" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1457" y1="249" x2="601" y2="311" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="831" y1="233" x2="1212" y2="597" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="817" y1="354" x2="277" y2="849" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="218" y1="675" x2="1389" y2="910" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1231" y1="945" x2="1069" y2="40" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="842" y1="185" x2="460" y2="260" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="809" y1="4" x2="126" y2="138" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="794" y1="74" x2="1442" y2="330" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="320" y1="382" x2="1596" y2="940" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="750" y1="713" x2="1594" y2="592" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1178" y1="954" x2="138" y2="441" stroke="#d4c29b" opacity="0.07" stroke-width="1"/>
    <circle cx="332" cy="532" r="35" fill="#d4c29b" opacity="0.115"/><circle cx="756" cy="581" r="104" fill="#d4c29b" opacity="0.036"/><circle cx="848" cy="800" r="79" fill="#d4c29b" opacity="0.035"/><circle cx="515" cy="370" r="59" fill="#d4c29b" opacity="0.074"/><circle cx="1227" cy="457" r="40" fill="#d4c29b" opacity="0.136"/><circle cx="1301" cy="580" r="92" fill="#d4c29b" opacity="0.046"/><circle cx="982" cy="523" r="30" fill="#d4c29b" opacity="0.072"/><circle cx="1222" cy="535" r="36" fill="#d4c29b" opacity="0.049"/><circle cx="812" cy="675" r="15" fill="#d4c29b" opacity="0.156"/><circle cx="1062" cy="141" r="87" fill="#d4c29b" opacity="0.054"/><circle cx="312" cy="623" r="30" fill="#d4c29b" opacity="0.067"/><circle cx="1390" cy="735" r="42" fill="#d4c29b" opacity="0.080"/><circle cx="526" cy="747" r="105" fill="#d4c29b" opacity="0.112"/><circle cx="1328" cy="587" r="31" fill="#d4c29b" opacity="0.065"/><circle cx="1015" cy="420" r="76" fill="#d4c29b" opacity="0.104"/><circle cx="285" cy="595" r="29" fill="#d4c29b" opacity="0.030"/><circle cx="308" cy="655" r="15" fill="#d4c29b" opacity="0.033"/><circle cx="1023" cy="172" r="66" fill="#d4c29b" opacity="0.091"/>
  </g>

  <g
    transform="translate(800 480) rotate(-11)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8b6541"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#d4c29b"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#d4c29b"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      La carretera
    </text>

    <text
      x="2"
      y="55"
      fill="#d4c29b"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      El lugar de la interrupción
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
