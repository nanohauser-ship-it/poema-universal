<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100f"/>
      <stop offset="52%" stop-color="#28433e"/>
      <stop offset="100%" stop-color="#07100f"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#c3c7b2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c3c7b2" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="96"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="253"
      cy="370"
      rx="379.09999999999997"
      ry="223"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="151" y1="453" x2="1416" y2="978" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1281" y1="183" x2="446" y2="979" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="508" y1="588" x2="735" y2="817" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1280" y1="427" x2="561" y2="582" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="995" y1="723" x2="701" y2="574" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="861" y1="102" x2="1378" y2="948" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1058" y1="200" x2="176" y2="378" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="767" y1="194" x2="1514" y2="991" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="173" y1="979" x2="340" y2="264" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1427" y1="301" x2="774" y2="83" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1327" y1="459" x2="1416" y2="751" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1039" y1="595" x2="666" y2="225" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="126" y1="150" x2="891" y2="675" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1501" y1="2" x2="1239" y2="633" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="224" y1="301" x2="955" y2="283" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1104" y1="292" x2="1426" y2="421" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/>
    <circle cx="404" cy="404" r="105" fill="#c3c7b2" opacity="0.155"/><circle cx="565" cy="877" r="99" fill="#c3c7b2" opacity="0.158"/><circle cx="928" cy="788" r="52" fill="#c3c7b2" opacity="0.073"/><circle cx="310" cy="872" r="49" fill="#c3c7b2" opacity="0.048"/><circle cx="495" cy="707" r="102" fill="#c3c7b2" opacity="0.030"/><circle cx="1500" cy="650" r="74" fill="#c3c7b2" opacity="0.069"/><circle cx="876" cy="805" r="77" fill="#c3c7b2" opacity="0.086"/><circle cx="1251" cy="449" r="63" fill="#c3c7b2" opacity="0.141"/><circle cx="1162" cy="883" r="85" fill="#c3c7b2" opacity="0.068"/><circle cx="1019" cy="412" r="73" fill="#c3c7b2" opacity="0.099"/><circle cx="1115" cy="111" r="16" fill="#c3c7b2" opacity="0.111"/><circle cx="717" cy="604" r="67" fill="#c3c7b2" opacity="0.078"/><circle cx="196" cy="175" r="26" fill="#c3c7b2" opacity="0.144"/><circle cx="983" cy="539" r="23" fill="#c3c7b2" opacity="0.107"/><circle cx="355" cy="212" r="83" fill="#c3c7b2" opacity="0.101"/><circle cx="525" cy="714" r="50" fill="#c3c7b2" opacity="0.035"/><circle cx="1116" cy="498" r="68" fill="#c3c7b2" opacity="0.069"/><circle cx="770" cy="646" r="45" fill="#c3c7b2" opacity="0.044"/>
  </g>

  <g
    transform="translate(800 480) rotate(3)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#805d4e"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#c3c7b2"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#c3c7b2"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Playa de Cyterea
    </text>

    <text
      x="2"
      y="55"
      fill="#c3c7b2"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      El mar al final de las puertas
    </text>

    <line
