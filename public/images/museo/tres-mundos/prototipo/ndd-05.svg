<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d0a"/>
      <stop offset="52%" stop-color="#54432e"/>
      <stop offset="100%" stop-color="#100d0a"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#d4c29b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d4c29b" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="29"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1030"
      cy="372"
      rx="372.3"
      ry="219"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="384" y1="486" x2="1401" y2="189" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="823" y1="606" x2="304" y2="328" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="974" y1="693" x2="177" y2="458" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1360" y1="532" x2="1407" y2="430" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="662" y1="991" x2="969" y2="221" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1450" y1="221" x2="712" y2="748" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="344" y1="353" x2="161" y2="455" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="212" y1="968" x2="1373" y2="239" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="290" y1="266" x2="1552" y2="319" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="157" y1="189" x2="1001" y2="769" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="448" y1="567" x2="1157" y2="712" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="924" y1="959" x2="1438" y2="923" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="549" y1="69" x2="404" y2="208" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="756" y1="636" x2="278" y2="730" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1516" y1="374" x2="360" y2="684" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1537" y1="631" x2="1489" y2="120" stroke="#d4c29b" opacity="0.07" stroke-width="1"/>
    <circle cx="558" cy="160" r="30" fill="#d4c29b" opacity="0.069"/><circle cx="137" cy="788" r="8" fill="#d4c29b" opacity="0.122"/><circle cx="1201" cy="623" r="84" fill="#d4c29b" opacity="0.146"/><circle cx="924" cy="188" r="30" fill="#d4c29b" opacity="0.044"/><circle cx="459" cy="186" r="34" fill="#d4c29b" opacity="0.089"/><circle cx="1458" cy="847" r="26" fill="#d4c29b" opacity="0.097"/><circle cx="406" cy="427" r="92" fill="#d4c29b" opacity="0.114"/><circle cx="156" cy="114" r="82" fill="#d4c29b" opacity="0.151"/><circle cx="664" cy="842" r="47" fill="#d4c29b" opacity="0.141"/><circle cx="310" cy="518" r="86" fill="#d4c29b" opacity="0.133"/><circle cx="551" cy="836" r="72" fill="#d4c29b" opacity="0.075"/><circle cx="564" cy="745" r="44" fill="#d4c29b" opacity="0.086"/><circle cx="1261" cy="391" r="58" fill="#d4c29b" opacity="0.144"/><circle cx="1107" cy="617" r="101" fill="#d4c29b" opacity="0.098"/><circle cx="1158" cy="866" r="61" fill="#d4c29b" opacity="0.095"/><circle cx="371" cy="628" r="48" fill="#d4c29b" opacity="0.057"/><circle cx="863" cy="435" r="32" fill="#d4c29b" opacity="0.081"/><circle cx="978" cy="511" r="14" fill="#d4c29b" opacity="0.117"/>
  </g>

  <g
    transform="translate(800 480) rotate(6)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8b6541"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#d4c29b"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#d4c29b"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      La hoja superviviente
    </text>

    <text
      x="2"
      y="55"
      fill="#d4c29b"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Anexada al cuaderno
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8b6541"
      stroke-opacity="0.62"
    />
  </g>
</svg>