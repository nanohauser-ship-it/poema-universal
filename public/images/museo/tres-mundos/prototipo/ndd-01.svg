<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d0a"/>
      <stop offset="52%" stop-color="#54432e"/>
      <stop offset="100%" stop-color="#100d0a"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#d4c29b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d4c29b" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="13"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1017"
      cy="572"
      rx="333.2"
      ry="196"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="1020" y1="73" x2="1441" y2="471" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="999" y1="813" x2="129" y2="259" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="196" y1="547" x2="1207" y2="446" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="17" y1="939" x2="1458" y2="683" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="204" y1="624" x2="876" y2="55" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1469" y1="24" x2="306" y2="398" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1533" y1="6" x2="580" y2="823" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1335" y1="706" x2="417" y2="738" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1268" y1="965" x2="1351" y2="354" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="135" y1="640" x2="1436" y2="580" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1012" y1="47" x2="836" y2="269" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="812" y1="592" x2="165" y2="810" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="344" y1="564" x2="365" y2="577" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="576" y1="966" x2="597" y2="790" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="1397" y1="180" x2="876" y2="366" stroke="#d4c29b" opacity="0.07" stroke-width="1"/><line x1="748" y1="601" x2="390" y2="115" stroke="#d4c29b" opacity="0.07" stroke-width="1"/>
    <circle cx="907" cy="403" r="49" fill="#d4c29b" opacity="0.153"/><circle cx="1231" cy="703" r="83" fill="#d4c29b" opacity="0.114"/><circle cx="511" cy="191" r="47" fill="#d4c29b" opacity="0.073"/><circle cx="644" cy="624" r="10" fill="#d4c29b" opacity="0.061"/><circle cx="576" cy="410" r="35" fill="#d4c29b" opacity="0.033"/><circle cx="619" cy="803" r="35" fill="#d4c29b" opacity="0.128"/><circle cx="353" cy="206" r="38" fill="#d4c29b" opacity="0.123"/><circle cx="893" cy="408" r="44" fill="#d4c29b" opacity="0.121"/><circle cx="411" cy="402" r="16" fill="#d4c29b" opacity="0.141"/><circle cx="649" cy="192" r="100" fill="#d4c29b" opacity="0.132"/><circle cx="122" cy="308" r="30" fill="#d4c29b" opacity="0.149"/><circle cx="201" cy="414" r="16" fill="#d4c29b" opacity="0.154"/><circle cx="726" cy="250" r="87" fill="#d4c29b" opacity="0.073"/><circle cx="799" cy="361" r="13" fill="#d4c29b" opacity="0.110"/><circle cx="565" cy="208" r="34" fill="#d4c29b" opacity="0.116"/><circle cx="1064" cy="502" r="44" fill="#d4c29b" opacity="0.038"/><circle cx="1395" cy="266" r="56" fill="#d4c29b" opacity="0.112"/><circle cx="1458" cy="167" r="98" fill="#d4c29b" opacity="0.085"/>
  </g>

  <g
    transform="translate(800 480) rotate(-1)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8b6541"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#d4c29b"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#d4c29b"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#d4c29b"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#d4c29b"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      El Árbol Blanco
    </text>

    <text
      x="2"
      y="55"
      fill="#d4c29b"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Antes del incendio
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8b6541"
      stroke-opacity="0.62"
    />
  </g>
</svg>