<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100f"/>
      <stop offset="52%" stop-color="#28433e"/>
      <stop offset="100%" stop-color="#07100f"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#c3c7b2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c3c7b2" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="68"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1342"
      cy="299"
      rx="396.09999999999997"
      ry="233"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="1515" y1="698" x2="638" y2="179" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="565" y1="258" x2="848" y2="781" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="412" y1="890" x2="262" y2="369" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="503" y1="538" x2="1523" y2="389" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="624" y1="177" x2="532" y2="600" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1191" y1="37" x2="419" y2="608" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="671" y1="905" x2="1031" y2="662" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="23" y1="176" x2="251" y2="87" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="227" y1="755" x2="1571" y2="529" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1289" y1="253" x2="714" y2="139" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="236" y1="681" x2="988" y2="951" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1135" y1="428" x2="1324" y2="329" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="621" y1="861" x2="1592" y2="328" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="202" y1="594" x2="1398" y2="253" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1171" y1="328" x2="1530" y2="283" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="117" y1="461" x2="1570" y2="245" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/>
    <circle cx="348" cy="690" r="97" fill="#c3c7b2" opacity="0.035"/><circle cx="1115" cy="730" r="73" fill="#c3c7b2" opacity="0.160"/><circle cx="1291" cy="809" r="13" fill="#c3c7b2" opacity="0.033"/><circle cx="1109" cy="632" r="53" fill="#c3c7b2" opacity="0.132"/><circle cx="1065" cy="889" r="9" fill="#c3c7b2" opacity="0.122"/><circle cx="1442" cy="261" r="17" fill="#c3c7b2" opacity="0.081"/><circle cx="1141" cy="686" r="58" fill="#c3c7b2" opacity="0.118"/><circle cx="408" cy="508" r="66" fill="#c3c7b2" opacity="0.098"/><circle cx="1064" cy="668" r="84" fill="#c3c7b2" opacity="0.159"/><circle cx="1414" cy="722" r="38" fill="#c3c7b2" opacity="0.041"/><circle cx="1460" cy="501" r="102" fill="#c3c7b2" opacity="0.044"/><circle cx="305" cy="901" r="84" fill="#c3c7b2" opacity="0.148"/><circle cx="460" cy="86" r="39" fill="#c3c7b2" opacity="0.077"/><circle cx="1512" cy="714" r="32" fill="#c3c7b2" opacity="0.094"/><circle cx="1251" cy="793" r="97" fill="#c3c7b2" opacity="0.050"/><circle cx="782" cy="781" r="72" fill="#c3c7b2" opacity="0.081"/><circle cx="831" cy="839" r="35" fill="#c3c7b2" opacity="0.044"/><circle cx="1273" cy="414" r="14" fill="#c3c7b2" opacity="0.146"/>
  </g>

  <g
    transform="translate(800 480) rotate(13)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#805d4e"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#c3c7b2"
