<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100f"/>
      <stop offset="52%" stop-color="#28433e"/>
      <stop offset="100%" stop-color="#07100f"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#c3c7b2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c3c7b2" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="52"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1234"
      cy="186"
      rx="304.3"
      ry="179"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="485" y1="767" x2="390" y2="577" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="988" y1="491" x2="1119" y2="179" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1581" y1="610" x2="346" y2="20" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="87" y1="650" x2="1269" y2="300" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1124" y1="492" x2="744" y2="638" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="748" y1="911" x2="361" y2="555" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="476" y1="701" x2="197" y2="615" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="27" y1="558" x2="472" y2="774" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1599" y1="481" x2="1307" y2="878" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="395" y1="192" x2="5" y2="848" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1217" y1="977" x2="1435" y2="116" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="119" y1="123" x2="1270" y2="400" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="255" y1="463" x2="230" y2="59" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1055" y1="165" x2="754" y2="764" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="295" y1="576" x2="1512" y2="702" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1312" y1="951" x2="1469" y2="101" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/>
    <circle cx="1486" cy="317" r="44" fill="#c3c7b2" opacity="0.125"/><circle cx="121" cy="384" r="17" fill="#c3c7b2" opacity="0.146"/><circle cx="1153" cy="211" r="70" fill="#c3c7b2" opacity="0.095"/><circle cx="508" cy="376" r="101" fill="#c3c7b2" opacity="0.109"/><circle cx="448" cy="181" r="62" fill="#c3c7b2" opacity="0.051"/><circle cx="1320" cy="848" r="88" fill="#c3c7b2" opacity="0.136"/><circle cx="1241" cy="835" r="24" fill="#c3c7b2" opacity="0.108"/><circle cx="86" cy="529" r="29" fill="#c3c7b2" opacity="0.130"/><circle cx="1363" cy="799" r="66" fill="#c3c7b2" opacity="0.050"/><circle cx="1113" cy="106" r="38" fill="#c3c7b2" opacity="0.111"/><circle cx="1216" cy="257" r="76" fill="#c3c7b2" opacity="0.052"/><circle cx="751" cy="456" r="39" fill="#c3c7b2" opacity="0.127"/><circle cx="1187" cy="578" r="88" fill="#c3c7b2" opacity="0.113"/><circle cx="982" cy="144" r="53" fill="#c3c7b2" opacity="0.130"/><circle cx="379" cy="205" r="44" fill="#c3c7b2" opacity="0.140"/><circle cx="575" cy="301" r="50" fill="#c3c7b2" opacity="0.101"/><circle cx="179" cy="376" r="34" fill="#c3c7b2" opacity="0.158"/><circle cx="386" cy="626" r="43" fill="#c3c7b2" opacity="0.038"/>
  </g>

  <g
    transform="translate(800 480) rotate(-10)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#805d4e"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#c3c7b2"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#c3c7b2"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Atlas frente al metro
    </text>

    <text
      x="2"
      y="55"
      fill="#c3c7b2"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      El perro como umbral
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#805d4e"
      stroke-opacity="0.62"
    />
  </g>
</svg>