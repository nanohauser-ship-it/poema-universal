<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b0e"/>
      <stop offset="52%" stop-color="#46505b"/>
      <stop offset="100%" stop-color="#080b0e"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#ddd9ce" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ddd9ce" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="63"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="457"
      cy="198"
      rx="289.0"
      ry="170"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="1289" y1="137" x2="1389" y2="626" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="891" y1="854" x2="1056" y2="897" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="546" y1="894" x2="403" y2="902" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="394" y1="768" x2="599" y2="801" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1488" y1="247" x2="1258" y2="422" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="367" y1="104" x2="590" y2="166" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="260" y1="429" x2="55" y2="713" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="881" y1="486" x2="1239" y2="93" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="297" y1="536" x2="318" y2="413" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1343" y1="234" x2="1314" y2="522" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="359" y1="102" x2="607" y2="670" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="747" y1="393" x2="909" y2="545" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="102" y1="798" x2="1078" y2="539" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="1535" y1="59" x2="1007" y2="79" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="483" y1="994" x2="201" y2="145" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/><line x1="832" y1="577" x2="1108" y2="628" stroke="#ddd9ce" opacity="0.07" stroke-width="1"/>
    <circle cx="682" cy="428" r="94" fill="#ddd9ce" opacity="0.096"/><circle cx="627" cy="306" r="14" fill="#ddd9ce" opacity="0.042"/><circle cx="1519" cy="541" r="14" fill="#ddd9ce" opacity="0.101"/><circle cx="1033" cy="780" r="103" fill="#ddd9ce" opacity="0.065"/><circle cx="986" cy="852" r="23" fill="#ddd9ce" opacity="0.132"/><circle cx="869" cy="125" r="48" fill="#ddd9ce" opacity="0.117"/><circle cx="648" cy="516" r="68" fill="#ddd9ce" opacity="0.129"/><circle cx="229" cy="699" r="50" fill="#ddd9ce" opacity="0.123"/><circle cx="1238" cy="466" r="13" fill="#ddd9ce" opacity="0.089"/><circle cx="688" cy="415" r="102" fill="#ddd9ce" opacity="0.046"/><circle cx="1403" cy="895" r="40" fill="#ddd9ce" opacity="0.028"/><circle cx="1313" cy="812" r="68" fill="#ddd9ce" opacity="0.048"/><circle cx="1217" cy="541" r="98" fill="#ddd9ce" opacity="0.033"/><circle cx="305" cy="444" r="95" fill="#ddd9ce" opacity="0.150"/><circle cx="850" cy="378" r="98" fill="#ddd9ce" opacity="0.049"/><circle cx="700" cy="146" r="22" fill="#ddd9ce" opacity="0.061"/><circle cx="559" cy="618" r="103" fill="#ddd9ce" opacity="0.134"/><circle cx="1258" cy="127" r="83" fill="#ddd9ce" opacity="0.073"/>
  </g>

  <g
    transform="translate(800 480) rotate(6)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#8295a6"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#ddd9ce"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#ddd9ce"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#ddd9ce"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#ddd9ce"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Nadir bajo el arco
    </text>

    <text
      x="2"
      y="55"
      fill="#ddd9ce"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      El perro que ya no regresará
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#8295a6"
      stroke-opacity="0.62"
    />
  </g>
</svg>