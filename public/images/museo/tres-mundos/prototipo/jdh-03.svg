<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100f"/>
      <stop offset="52%" stop-color="#28433e"/>
      <stop offset="100%" stop-color="#07100f"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#c3c7b2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c3c7b2" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="45"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
        result="mono"
      />
      <feBlend
        in="SourceGraphic"
        in2="mono"
        mode="soft-light"
      />
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>

  <g filter="url(#blur)" opacity="0.62">
    <ellipse
      cx="1270"
      cy="231"
      rx="411.4"
      ry="242"
      fill="url(#halo)"
    />
  </g>

  <g>
    <line x1="1413" y1="599" x2="8" y2="103" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1593" y1="378" x2="392" y2="691" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1561" y1="344" x2="273" y2="93" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1164" y1="697" x2="824" y2="466" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1157" y1="755" x2="885" y2="749" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1010" y1="45" x2="1446" y2="335" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="871" y1="492" x2="231" y2="181" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="531" y1="398" x2="430" y2="414" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1504" y1="660" x2="591" y2="144" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1530" y1="22" x2="873" y2="976" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="219" y1="300" x2="12" y2="14" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1525" y1="869" x2="1288" y2="159" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1493" y1="284" x2="680" y2="258" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1505" y1="110" x2="1482" y2="506" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="573" y1="389" x2="1188" y2="214" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/><line x1="1409" y1="772" x2="1068" y2="379" stroke="#c3c7b2" opacity="0.07" stroke-width="1"/>
    <circle cx="965" cy="588" r="22" fill="#c3c7b2" opacity="0.143"/><circle cx="656" cy="481" r="59" fill="#c3c7b2" opacity="0.059"/><circle cx="1221" cy="611" r="24" fill="#c3c7b2" opacity="0.105"/><circle cx="799" cy="284" r="22" fill="#c3c7b2" opacity="0.071"/><circle cx="1455" cy="554" r="12" fill="#c3c7b2" opacity="0.127"/><circle cx="276" cy="140" r="62" fill="#c3c7b2" opacity="0.050"/><circle cx="420" cy="900" r="51" fill="#c3c7b2" opacity="0.104"/><circle cx="1400" cy="327" r="24" fill="#c3c7b2" opacity="0.044"/><circle cx="503" cy="679" r="33" fill="#c3c7b2" opacity="0.046"/><circle cx="91" cy="683" r="71" fill="#c3c7b2" opacity="0.060"/><circle cx="720" cy="865" r="74" fill="#c3c7b2" opacity="0.113"/><circle cx="725" cy="491" r="26" fill="#c3c7b2" opacity="0.047"/><circle cx="471" cy="89" r="60" fill="#c3c7b2" opacity="0.107"/><circle cx="166" cy="500" r="47" fill="#c3c7b2" opacity="0.111"/><circle cx="155" cy="726" r="43" fill="#c3c7b2" opacity="0.095"/><circle cx="902" cy="863" r="30" fill="#c3c7b2" opacity="0.134"/><circle cx="268" cy="760" r="98" fill="#c3c7b2" opacity="0.081"/><circle cx="365" cy="635" r="11" fill="#c3c7b2" opacity="0.145"/>
  </g>

  <g
    transform="translate(800 480) rotate(13)"
    opacity="0.78"
  >
    <circle
      cx="0"
      cy="0"
      r="235"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.16"
    />

    <circle
      cx="0"
      cy="0"
      r="164"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.2"
      stroke-dasharray="4 15"
    />

    <path
      d="M -330 40 C -180 -230 180 -230 330 40"
      fill="none"
      stroke="#805d4e"
      stroke-opacity="0.45"
      stroke-width="3"
    />

    <path
      d="M -330 85 C -150 290 150 290 330 85"
      fill="none"
      stroke="#c3c7b2"
      stroke-opacity="0.24"
      stroke-width="2"
    />

    <line
      x1="-410"
      y1="0"
      x2="410"
      y2="0"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />

    <line
      x1="0"
      y1="-310"
      x2="0"
      y2="310"
      stroke="#c3c7b2"
      stroke-opacity="0.15"
    />
  </g>

  <rect
    x="38"
    y="38"
    width="1524"
    height="924"
    fill="none"
    stroke="#c3c7b2"
    stroke-opacity="0.14"
  />

  <g filter="url(#grain)">
    <rect
      width="1600"
      height="1000"
      fill="transparent"
    />
  </g>

  <g transform="translate(86 825)">
    <text
      x="0"
      y="0"
      fill="#c3c7b2"
      fill-opacity="0.92"
      font-family="Georgia, serif"
      font-size="48"
    >
      Cocina sin Fuego
    </text>

    <text
      x="2"
      y="55"
      fill="#c3c7b2"
      fill-opacity="0.58"
      font-family="Georgia, serif"
      font-size="22"
      font-style="italic"
    >
      Preparar sin transformar
    </text>

    <line
      x1="0"
      y1="87"
      x2="420"
      y2="87"
      stroke="#805d4e"
      stroke-opacity="0.62"
    />
  </g>
</svg>